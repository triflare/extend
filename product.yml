# Identity
name: "Triflare Extend"
command: "extend"
version: "0.4.0-alpha.1"
tagline: "Make your ideas real with powerful extensions."
author: "Triflare"
homepage: "https://github.com/triflare/extend"

# Branding
branding:
  colors:
    primary: "#FFA448"
    secondary: "#E67E22"
    tertiary: "#D46C10"

# Terminal Glyphs
symbols:
  success: "✓"
  error: "✗"
  progress: "~"
  bullet: "•"

# Marketplace
marketplace:
  apiUrl: "https://marketplace.sdisk.us/api/v1"
  clientName: "Triflare Extend"
  configDirectory: "triflare"
  maxSourceBytes: 1048576
  publishTimeoutMs: 120000

# Defaults
defaults:
  configFilename: "extend.yml"
  outputDirectory: "dist"
  devPort: 8000
